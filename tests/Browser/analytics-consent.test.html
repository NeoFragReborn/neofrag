<!doctype html>
<meta charset="utf-8">
<title>Google Analytics — chargé seulement s'il est accepté</title>

<!--
  La bannière de cookies demande au visiteur d'accepter ou de refuser les cookies analytiques, et
  jusqu'au 2026-09-17 le gabarit theme/analytics.tpl.php chargeait Google Analytics AVANT la
  réponse, dès qu'un identifiant était configuré. La bannière posait une question dont la réponse
  n'était pas attendue.

  Le script js/analytics-consent.js, émis tant que Google Analytics n'est pas accepté, attend
  l'événement `nf:consent` qu'émettent le bandeau et la fenêtre « Gérer mes cookies », avec la liste
  des services acceptés (2026-10-08, js/consentement.js). Ici on éprouve son contrat sur le VRAI
  fichier (/src/js/analytics-consent.js) : rien avant l'événement, rien sur un refus ni sur
  l'acceptation d'un AUTRE service, le chargeur de Google inséré avec le bon identifiant et le nonce
  de la page quand `analytics` est accepté, et une seule fois.
-->

<script src="/harness.js"></script>

<body>

<!-- Émis par le gabarit : l'identifiant en data-*, le nonce posé par le filtre d'index.php. -->
<script src="/src/js/analytics-consent.js" data-analytics-id="G-TEST123" nonce="NONCE-TEST"></script>

<script>
function scripts_google() {
	return Array.prototype.filter.call(document.querySelectorAll('script[src]'), function (s) {
		return s.src.indexOf('googletagmanager.com') !== -1;
	});
}

function consentir(services) {
	document.dispatchEvent(new CustomEvent('nf:consent', { detail: { services: services } }));
}

try {
	NFTest.verifie('avant toute réponse : aucun script Google, pas de dataLayer', [0, 'undefined'], [scripts_google().length, typeof window.dataLayer]);

	consentir([]);
	NFTest.verifie('un refus de tout ne charge rien', [0, 'undefined'], [scripts_google().length, typeof window.dataLayer]);

	consentir(['youtube', 'discord']);
	NFTest.verifie('accepter d\'autres services ne charge pas Google', [0, 'undefined'], [scripts_google().length, typeof window.dataLayer]);

	consentir(['youtube', 'analytics']);
	var google = scripts_google();
	NFTest.verifie('accepter Google Analytics insère le chargeur de Google', 1, google.length);
	NFTest.verifie('… avec l\'identifiant configuré', true, google.length === 1 && google[0].src.indexOf('id=G-TEST123') !== -1);
	NFTest.verifie('… avec le nonce de la page, sinon la CSP le refuserait', 'NONCE-TEST', google.length === 1 ? google[0].getAttribute('nonce') : null);
	NFTest.verifie('… en asynchrone', true, google.length === 1 && google[0].async);
	NFTest.verifie('la file dataLayer est initialisée avec js puis config', ['js', 'config', 'G-TEST123'],
		window.dataLayer && window.dataLayer.length === 2 ? [window.dataLayer[0][0], window.dataLayer[1][0], window.dataLayer[1][1]] : window.dataLayer);

	consentir(['analytics']);
	NFTest.verifie('une seconde acceptation ne charge pas deux fois', 1, scripts_google().length);
}
catch (e) {
	NFTest.echec('exception : ' + (e && e.message || e));
}

NFTest.fini();
</script>
