# Un hébergement mutualisé, tel qu'en proposent les hébergeurs : PHP n'y lance aucun programme, ne lit
# rien hors du site et de /tmp, et n'a que 128 Mo de mémoire. Ces réglages ne touchent que le PHP du
# serveur web (php_admin_value) : les outils d'épreuve, lancés en ligne de commande, n'en sont pas bridés.
<Directory /var/www/neofrag>
	php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,proc_nice,show_source,symlink,link,dl"
	php_admin_value open_basedir "/var/www/neofrag:/tmp"
	php_admin_value memory_limit "128M"
</Directory>
