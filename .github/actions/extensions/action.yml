name: Poser les extensions
description: >-
  Le dépôt neofrag ne porte que le cœur et les addons d'identité ; la documentation, la NOTICE et la
  suite de tests décrivent le produit entier. Là où les addons à la carte manquent, cette action clone
  NeoFragReborn/extensions et les pose dans l'arbre (tools/assembler.php). Là où ils sont déjà — le
  dépôt de développement —, elle ne fait rien.

inputs:
  app-id:
    description: "L'application de l'organisation, tant qu'extensions est privé (vide une fois public)."
    required: false
    default: ''
  app-cle:
    description: "Sa clé privée."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Les addons à la carte manquent-ils ?
      id: besoin
      shell: bash
      run: |
        if php -r 'require "tools/lib/outil.php"; require "tools/lib/depot.php"; exit(nf_extensions_absentes() ? 0 : 1);'; then
          echo "poser=oui" >> "$GITHUB_OUTPUT"
        else
          echo "poser=non" >> "$GITHUB_OUTPUT"
        fi

    - name: Jeton de lecture d'extensions (dépôt encore privé)
      id: jeton
      if: ${{ steps.besoin.outputs.poser == 'oui' && inputs.app-id != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-cle }}
        owner: NeoFragReborn
        repositories: extensions

    # Une VERSION publiée (une étiquette vX.Y.Z sur ce commit) se juge avec les addons de la même version.
    # Les deux dépôts partent l'un après l'autre : le 2026-10-04, neofrag 1.2.26 a été testé avec les
    # addons de la 1.2.25, encore sur main, et sa CI est restée rouge. On attend donc l'étiquette jumelle,
    # un quart d'heure au plus ; hors version (une pull request), main.
    - name: La version d'extensions à poser
      id: partenaire
      if: ${{ steps.besoin.outputs.poser == 'oui' }}
      shell: bash
      env:
        JETON: ${{ steps.jeton.outputs.token }}
      run: |
        acces="https://github.com"
        [ -n "$JETON" ] && acces="https://x-access-token:${JETON}@github.com"
        # awk lit TOUTE la liste et ne garde que la première correspondance : un `exit` fermait le tuyau avant la
        # fin, git recevait SIGPIPE (code 141), et `pipefail` faisait échouer l'étape — au hasard du débit,
        # selon que la liste tenait ou non dans le tampon (CI publique rouge à la 1.2.32, 2026-10-06).
        version=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
          | awk -v sha="$GITHUB_SHA" '$1 == sha && !vu { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; vu = 1 }')
        ref=main
        if [ -n "$version" ]; then
          for i in $(seq 1 30); do
            if git ls-remote --exit-code --tags "${acces}/NeoFragReborn/extensions.git" "refs/tags/${version}" > /dev/null; then
              ref="$version"
              break
            fi
            echo "extensions n'a pas encore ${version} : on l'attend (${i}/30)…"
            sleep 30
          done
          [ "$ref" = main ] && echo "::warning::extensions n'a pas reçu ${version} en un quart d'heure : sa branche main est posée."
        fi
        echo "extensions posé : ${ref}"
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"

    - name: Cloner extensions
      if: ${{ steps.besoin.outputs.poser == 'oui' }}
      uses: actions/checkout@v7
      with:
        repository: NeoFragReborn/extensions
        ref: ${{ steps.partenaire.outputs.ref }}
        path: _extensions
        token: ${{ steps.jeton.outputs.token || github.token }}

    # Les addons posés sont inscrits dans .git/info/exclude ; le clone, lui, n'a plus rien à faire là.
    - name: Assembler
      if: ${{ steps.besoin.outputs.poser == 'oui' }}
      shell: bash
      run: php tools/assembler.php --extensions=_extensions && rm -rf _extensions
