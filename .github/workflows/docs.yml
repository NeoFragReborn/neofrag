name: Documentation

# Un envoi qui ne touche que de la documentation n'exécute pas la CI (environ 11 minutes facturées,
# cf. ci.yml) : ce workflow vérifie en une minute ce que la documentation doit tenir — chiffres
# d'inventaire, renvois, conventions des outils et catalogue de tools/README.md. Il obéit au même
# interrupteur que la CI : la variable de dépôt `CI_ENVOI` à `pause` le suspend (cf. ci.yml).
on:
  push:
    branches: [main]
    paths: ['docs/**', '**/*.md']
  pull_request:
    paths: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation ↔ code
    if: vars.CI_ENVOI != 'pause'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Le produit entier : dans le dépôt neofrag, les addons à la carte viennent d'extensions.
      - uses: ./.github/actions/extensions
        with:
          app-id: ${{ vars.NF_APP_ID }}
          app-cle: ${{ secrets.NF_APP_CLE }}
      - name: Garde documentation ↔ code
        run: php tools/check-docs.php
      - name: Garde des conventions des outils (catalogue de tools/README.md)
        run: php tools/check-tools.php
