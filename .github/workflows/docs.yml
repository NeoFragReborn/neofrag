name: Documentation

# Un envoi qui ne touche que de la documentation n'exécute pas la CI complète (21 minutes facturées,
# cf. ci.yml) : ce workflow vérifie en une minute ce que la documentation doit tenir — chiffres
# d'inventaire, renvois, conventions des outils et catalogue de tools/README.md.
on:
  push:
    branches: [main]
    paths: ['docs/**', '**/*.md']
  pull_request:
    paths: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation ↔ code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Garde documentation ↔ code
        run: php tools/check-docs.php
      - name: Garde des conventions des outils (catalogue de tools/README.md)
        run: php tools/check-tools.php
