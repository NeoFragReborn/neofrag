name: CI

# Le dépôt est privé : chaque exécution consomme le quota de GitHub Actions — 2 000 minutes par mois,
# et GitHub arrondit CHAQUE JOB à la minute supérieure. Septembre 2026 l'a épuisé le 23, et la CI
# s'est arrêtée jusqu'au 30 ; octobre en avait brûlé 1 900 le 2 au soir (192 exécutions). D'où :
#   - `push` sur main seulement : une branche de travail (Dependabot) passe par sa demande de fusion.
#     Avant, elle déclenchait DEUX exécutions — `push` et `pull_request` ne portent pas la même
#     référence, et la règle de concurrence ci-dessous ne les fusionnait pas ;
#   - un envoi qui ne touche QUE de la documentation n'exécute pas ce workflow : docs.yml la vérifie
#     en une minute ;
#   - Dependabot regroupe ses mises à jour (.github/dependabot.yml) ;
#   - un envoi joue la batterie RAPIDE — `statique`, PHPUnit sur PHP 8.2, `db-smoke`, `e2e-smoke`,
#     environ 11 minutes facturées. La batterie ENTIÈRE (Interface, et PHPUnit sur 8.2 à 8.5) se
#     lance à la main avant chaque version — étape 1 de docs/RELEASING.md : `gh workflow run CI` ;
#   - les petits contrôles vivent dans UN job, `statique` : en jobs séparés, chacun payait sa minute
#     arrondie et sa préparation (9,5 minutes de travail facturées 14 le 2026-10-02) ;
#   - l'INTERRUPTEUR : la variable de dépôt `CI_ENVOI` à `pause` suspend la batterie des envois (et
#     docs.yml) sans rien consommer ; la batterie manuelle joue toujours. Quand le quota du mois
#     s'épuise, `php tools/un outil interne.php` le mesure et donne les deux commandes.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# Une nouvelle exécution sur la même référence annule la précédente, devenue inutile — mais un envoi
# n'annule jamais la batterie entière lancée à la main : d'où l'événement dans le groupe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  statique:
    name: Contrôles statiques (syntaxe, gardes, PHPStan, audits, épreuves JS, bot)
    if: github.event_name == 'workflow_dispatch' || vars.CI_ENVOI != 'pause'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - name: php -l sur tout le code (hors vendor)
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Gardes anti-régression (anti-patterns connus)
        if: ${{ !cancelled() }}
        run: |
          # notify() n'accepte que success|info|warning|danger (Bootstrap). 'error'/'warn'/'fail' → rendu VERT.
          if grep -rnE "notify\([^;]*,[[:space:]]*'(error|warn|fail|failure|ko)'\)" --include='*.php' modules/ neofrag/; then
            echo "::error::notify() avec un type invalide (s'affiche en vert). Utiliser 'danger'."
            exit 1
          fi
          # CSRF : tout fichier qui émet un lien d'action mutante (csrf_url/csrf_token) doit aussi
          # vérifier le jeton dans le même fichier (check_csrf) — sinon l'action GET est exposée au CSRF.
          csrf_viol=0
          for f in $(grep -rlE "csrf_url\(|csrf_token\(" --include='*.php' modules/ neofrag/ | grep -v 'admin_helpers.php'); do
            if ! grep -qE "check_csrf\(" "$f"; then
              echo "::error::$f émet csrf_url/csrf_token sans check_csrf (action mutante exposée au CSRF)."
              csrf_viol=1
            fi
          done
          [ "$csrf_viol" = "1" ] && exit 1 || true
      # Les outils eux-mêmes respectent leurs conventions (en-tête, garde par le socle, plomberie
      # dans tools/lib/, verdicts, ports, catalogue de tools/README.md à jour). Sans ce contrôle,
      # chaque passe de rangement était à refaire à la suivante.
      - name: Garde des conventions des outils
        if: ${{ !cancelled() }}
        run: php tools/check-tools.php
      - name: Garde strict_types (ratchet — ne doit jamais baisser)
        if: ${{ !cancelled() }}
        run: php tools/check-strict-types.php
      # Découplage du paquet : chaque addon doit déclarer core/presets/requires, et le cœur ne doit
      # JAMAIS dépendre d'un addon optionnel. Sans ce contrôle, l'appartenance au cœur est un défaut
      # implicite — c'est ainsi qu'emojis, files et webhooks s'y sont retrouvés sans décision, et
      # c'est la même classe de défaut qui a produit le 500 de juin 2026 sur une install allégée.
      - name: Garde déclarations d'addons (cœur ↮ optionnel)
        if: ${{ !cancelled() }}
        run: php tools/check-addon-declarations.php
      # Couplage RÉEL entre addons, lu dans le code par le tokenizer PHP : quel addon lit la table,
      # nomme la classe, demande le service ou pointe la route d'un autre. Tout couplage FATAL
      # (table, classe) doit être déclaré dans `requires` ou annoté « couplage: <raison> » à
      # l'endroit où il a lieu. Sans ce contrôle, la moitié « qui dépend de qui » n'existe nulle
      # part — c'est ce trou qui a produit le 500 de juin 2026 sur une install allégée.
      - name: Garde couplage entre addons (déclaré ou annoté)
        if: ${{ !cancelled() }}
        run: php tools/check-addon-coupling.php
      # Caractères INVISIBLES dans les sources. Une séquence backslash-b mangée par un
      # outil d'édition, devenue un vrai BACKSPACE (0x08), a rendu muette la détection des tables
      # citées en JS de check-addon-coupling.php ci-dessus : le fichier passait `php -l`, le motif ne correspondait
      # simplement jamais, et le contrôle se disait vert en étant aveugle. Rien ne le voyait.
      - name: Garde hygiène des sources (aucun caractère invisible)
        if: ${{ !cancelled() }}
        run: php tools/check-source-hygiene.php
      # `php -l` pour le JavaScript, et le vocabulaire. Rien ne vérifiait la syntaxe des fichiers JS :
      # une parenthèse manquante ne se découvrait qu'en ouvrant la page. Une partie contient du PHP
      # interpolé, que `node --check` refuse : l'outil le neutralise avant de vérifier la structure.
      # Et jQuery n'est plus chargé depuis juin 2026 ; trois fichiers l'appelaient encore le 2026-09-17
      # et levaient « $ is not defined » au chargement — syntaxiquement valide, donc règle de vocabulaire.
      # node est préinstallé sur les runners ubuntu-latest.
      - name: Garde sources JavaScript (syntaxe et vocabulaire sans jQuery)
        if: ${{ !cancelled() }}
        run: php tools/check-js-sources.php
      # ESLint voit ce que les deux precedents ne voient pas : une globale creee par oubli d'un
      # `var`, un `innerHTML` nourri d'une valeur calculee, un `eval` deguise, du code apres un
      # `return`. Aucun paquet npm n'est deploye : ceci est de l'outillage, comme PHPStan.
      - name: Outillage front (ESLint)
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund
      - name: Garde ESLint (globales implicites, innerHTML calcule, eval)
        if: ${{ !cancelled() }}
        run: php tools/check-js-lint.php
      # Deux copies IDENTIQUES d'un meme asset, l'une dans le cœur l'autre dans un addon : `path()`
      # resout selon l'APPELANT, donc deux pages servent deux fichiers differents. Tant qu'ils sont
      # identiques rien ne se voit ; le jour ou l'on en modifie un, la moitie des pages garde
      # l'ancien, sans erreur ni trace. C'est ce qui a fait afficher l'assistant de widget sans
      # aucun style le 2026-09-15, alors que la feuille etait bien deployee.
      - name: Garde assets masqués (aucune copie identique)
        if: ${{ !cancelled() }}
        run: php tools/check-assets.php
      # La documentation respecte ses règles : chiffres d'inventaire justes (« 53 modules » affiché
      # pendant des semaines pour 54 réels), renvois vivants (Markdown ne se compile pas), aucun
      # document orphelin, aucun outil nommé qui n'existe plus, aucune prose recopiée d'un document
      # à l'autre (c'est la copie qui diverge, et qui coûte une passe de rangement à chaque fois).
      - name: Garde documentation ↔ code
        if: ${{ !cancelled() }}
        run: php tools/check-docs.php
      # Un module se branche sur un « carrefour » en posant `controllers/<carrefour>.php`, et le
      # carrefour appelle la méthode du même nom sans rien vérifier. Si elle est renommée, rendue
      # privée ou dotée d'un paramètre obligatoire de plus, l'erreur fatale n'apparaît qu'à
      # l'ouverture de la page qui agrège — en production. 39 contrats sont vérifiés ici.
      - name: Garde contrats d'addons (carrefours + régions de thème)
        if: ${{ !cancelled() }}
        run: php tools/check-addon-contracts.php
      # Tout ce qui concerne lang() : les clés absentes des six langues (un avertissement PHP à
      # chaque rendu — 3 846 en une journée de production), les formats de date que chaque langue
      # doit déclarer, les pluriels sans assez d'arguments (une page 404 avec le bon titre), et les
      # traductions qui ont perdu la forme plurielle de leur source (« 3 topic », 47 cas).
      - name: Garde traductions (les six langues, formats de date, pluriels)
        if: ${{ !cancelled() }}
        run: php tools/check-langs.php --toutes
      # check-langs ne voit que ce qui passe DÉJÀ par lang(). Un texte écrit en dur — `<th>Décision</th>`
      # dans une vue, `title = 'Retour en haut'` dans un script — restait en français sur un site
      # anglais : 340 relevés sur les pages rendues, 740 dans les sources, le 2026-09-23.
      - name: Garde textes en dur (tout texte d'interface passe par les traductions)
        if: ${{ !cancelled() }}
        run: php tools/check-textes-en-dur.php
      # `var(--nf-bg-elevated, #fff)` a l'air sûr : il y a un repli. C'est le piège. La variable
      # n'était définie que dans les thèmes PUBLICS ; sous l'administration, chaque usage retombait
      # sur le repli BLANC et posait un bloc blanc au milieu d'une page sombre. Le navigateur ne
      # signale rien, la feuille est valide, et le défaut ne se voit qu'à l'œil, dans le bon thème.
      - name: Garde variables CSS (employées ↔ définies par tous les thèmes)
        if: ${{ !cancelled() }}
        run: php tools/check-css-variables.php
      # Même famille de silence, autre cause : Bootstrap 5 a SUPPRIMÉ ou redéfini des classes de
      # Bootstrap 3 et 4. Une vue qui les emploie encore ne casse pas, elle s'affiche de travers — et
      # rien ne le signale. Depuis le 2026-09-23, le balisage est entièrement migré, et le contrôle
      # refuse tout nom hérité, même redéfini par une feuille : dans les gabarits, les feuilles, les
      # données livrées, et fabriqué par concaténation ; plus la grille sur une cellule de tableau et
      # la liste déroulante en `form-control`.
      - name: Garde legs Bootstrap 3 et 4 (aucun, même redéfini)
        if: ${{ !cancelled() }}
        run: php tools/check-classes-bs4.php
      # `->name` sur un addon CHARGE rend FALSE, sans le moindre avertissement : le nom est dans
      # info()->name. Trois endroits s'y etaient fait prendre (statistiques prefixees a vide,
      # exclusion de live_editor/pages inoperante, dependances toutes annoncees manquantes).
      - name: Garde nom d'addon (->name sur un addon chargé)
        if: ${{ !cancelled() }}
        run: php tools/check-addon-name.php
      # Un theme declare ses zones dans __info() ; l'installation cree une disposition par zone et
      # l'editeur de mise en page les propose. Si le gabarit n'appelle jamais region() ni zone(),
      # le widget qu'on y place est bien enregistre et ne s'affiche nulle part. `nebula` et
      # `vitrine` promettaient ainsi « Header » et « Footer » sans les tenir (2026-09-20).
      - name: Garde zones de thème (déclarées ↔ rendues)
        if: ${{ !cancelled() }}
        run: php tools/check-theme-zones.php
      # Un widget peut arriver SANS reglages : pose par l'install() d'un theme, ajoute en Live
      # Editor avant qu'on ouvre son formulaire, ou restaure depuis une disposition ancienne. Douze
      # checkers sur trente-huit lisaient leurs cles sans repli ; onze n'y perdaient qu'un
      # avertissement, le douzieme (`partners`) employait la sienne comme DIVISEUR et plantait.
      - name: Garde réglages de widget (lus ↔ avec valeur de repli)
        if: ${{ !cancelled() }}
        run: php tools/check-widget-reglages.php
      # Db::delete() exige sa table. L'ecriture heritee `->from('t')->…->delete()` levait une
      # ArgumentCountError : la desinscription de la newsletter, la suppression de son compte et la
      # desactivation de la double authentification tombaient sans rien supprimer (2026-10-01).
      - name: Garde suppressions par le constructeur de requêtes (la table est nommée)
        if: ${{ !cancelled() }}
        run: php tools/check-db-delete.php
      # Le site de démonstration ouvre son administration aux visiteurs. Ce qu'ils peuvent modifier
      # doit être exactement ce que la remise à zéro sait défaire — sans quoi la démo se dégrade
      # définitivement, une visite après l'autre.
      - name: Garde verrou du site de démonstration
        if: ${{ !cancelled() }}
        run: php tools/check-demo-lock.php
      # La démonstration se remet à zéro en rejouant install/demo.sql. Une clé primaire écrite deux
      # fois fait refuser TOUT l'import : le 2026-09-22, la remise à zéro a échoué quatorze heures
      # sans que rien le dise.
      - name: Garde instantanés SQL livrés (aucune clé primaire en double, historique des migrations complet)
        if: ${{ !cancelled() }}
        run: php tools/check-instantanes.php
      # Les `.htaccess` du paquet ne sont exercés par personne : la production tourne sous Caddy.
      # Ils avaient divergé dans le mauvais sens — `/les notes du mainteneur` servi en texte sur toute
      # installation Apache. Ce contrôle relit ce qu'Apache doit refuser, avec la raison de chaque ligne.
      - name: Garde .htaccess (Apache refuse tout ce que Caddy refuse)
        if: ${{ !cancelled() }}
        run: php tools/check-htaccess.php
      # Cinq contrôles écrits le 2026-10-02 n'étaient joués par personne : check-tools refuse
      # désormais un contrôle statique absent de ce fichier.
      - name: Garde requêtes à une colonne (valeurs lues comme des lignes)
        if: ${{ !cancelled() }}
        run: php tools/check-db-colonne.php
      - name: Garde compteurs (la date de modification n'avance pas)
        if: ${{ !cancelled() }}
        run: php tools/check-db-compteurs.php
      - name: Garde heures affichées (fuseau de qui regarde, format de la langue)
        if: ${{ !cancelled() }}
        run: php tools/check-heures.php
      - name: Garde pagination (une liste découpée affiche ses pages)
        if: ${{ !cancelled() }}
        run: php tools/check-pagination.php
      - name: Garde charte des boutons de l'administration
        if: ${{ !cancelled() }}
        run: php tools/check-actions-admin.php
      - name: composer install (PHPStan et le wiki en ont besoin)
        if: ${{ !cancelled() }}
        run: composer install --no-interaction --no-progress
      # Le bootstrap charge tout le code → toute classe qui fatalise au chargement (méthode abstraite
      # non implémentée, redéclaration de fonction native…) remonte en erreur SÉVÈRE. C'est précisément
      # ce qui a attrapé les 7 widgets cassés + array_last (conflit PHP 8.5). Le reste est gelé (baseline).
      - name: PHPStan (analyse statique)
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      # Le wiki livré (install/wiki.sql) et celui de la démonstration (install/demo.sql) sont
      # générés depuis docs/guide/ (la conversion passe par CommonMark : d'où sa place après
      # composer install). Rien ne disait quand les régénérer : le 2026-09-23, les dix pages
      # avaient une semaine de retard, et « Créer un widget » enseignait une classe de Bootstrap 4.
      - name: Garde wiki livré ↔ guides
        if: ${{ !cancelled() }}
        run: php tools/check-wiki-docs.php
      - name: Composer audit (CVE des dépendances verrouillées)
        if: ${{ !cancelled() }}
        run: composer audit --locked --no-interaction
      # Certaines propriétés du front ne s'observent QUE dans un navigateur : ce qui s'exécute ou non,
      # dans quel document, avec quel nonce CSP. Aucun test PHP ne les voit — et c'est précisément le
      # trou par lequel sont passées les cinq régressions de la dé-jQuery, puis le JS inerte des widgets
      # ajoutés en Live Editor, qui a vécu des mois sans que rien ne le signale.
      # Chrome est préinstallé sur les runners ubuntu-latest.
      - name: Épreuves JS de tests/Browser/ (navigateur sans interface)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: php tools/check-js.php
      # La version de Node la plus ancienne que le bot accepte (cf. bot/package.json, « engines ») :
      # ce qui passe ici passe sur les machines des administrateurs.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: '22.9'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Bot Discord — npm ci
        if: ${{ !cancelled() }}
        working-directory: bot
        run: npm ci --no-audit --no-fund
      # Le test qui compare le lien d'invitation du bot à celui du module Discord lit
      # modules/discord/discord.php : il juge ici, le dépôt entier étant présent.
      - name: Bot Discord — compilation TypeScript et tests
        if: ${{ !cancelled() }}
        working-directory: bot
        run: npm test
      - name: Bot Discord — npm audit (dépendances de production)
        if: ${{ !cancelled() }}
        working-directory: bot
        run: npm audit --omit=dev --audit-level=high

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    if: github.event_name == 'workflow_dispatch' || vars.CI_ENVOI != 'pause'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sans base de données, les 56 tests d'INTÉGRATION se sautent eux-mêmes en silence : la suite
    # s'affiche verte alors qu'un cinquième des tests n'a rien vérifié. Le service ci-dessous leur
    # donne une vraie base, préparée par tools/prepare-test-db.php.
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          # La base du site installé par ci-install (la suite headless s'y amorce) : l'Installer
          # s'y connecte, il ne la crée pas.
          MARIADB_DATABASE: neofrag
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NF_TEST_DB_HOST: 127.0.0.1
      NF_TEST_DB_PORT: '3306'
      NF_TEST_DB_NAME: neofrag_test
      NF_TEST_DB_USER: neofrag_test
      NF_TEST_DB_PASS: neofrag_test
      # Pour ci-install : la suite headless amorce le framework contre un site INSTALLÉ (config/ +
      # base). Sans installation, elle se sautait — 60 tests — et la CI restait verte quand même.
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
      NF_DB_NAME: neofrag
    strategy:
      fail-fast: false
      matrix:
        # NeoFrag Reborn supporte toutes les versions PHP >= 8.2 (cf. composer.json). La batterie
        # entière les teste toutes (régressions propres à une version, ex. unserialize) ; un envoi
        # ordinaire, la borne basse seulement — le quota (cf. en-tête). Aucun poste ne joue 8.2 :
        # la CI est seule à voir une fonction de 8.3 ou plus. La borne haute, 8.5, est celle de
        # l'atelier et de la production, où la suite passe avant chaque envoi ; `e2e-smoke` la joue
        # aussi sous PHP 8.3 (Dockerfile).
        php: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["8.2", "8.3", "8.4", "8.5"]') || fromJSON('["8.2"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Les mêmes extensions que les jobs qui installent le site : ci-install tourne ici aussi.
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
          tools: phpunit:11
      # Les tests touchent du code qui dépend du vendor (sanitize_html → HTMLPurifier, etc.). Sans
      # composer install, phpunit fatalise sur « Class HTMLPurifier_Config not found ». Le verrou
      # s'installe sur les quatre versions sans option : composer.json fixe la plateforme à PHP 8.2.0.
      - name: composer install
        run: composer install --no-interaction --no-progress
      # Un site installé pour de vrai : c'est ce qu'exige la suite headless, sur les quatre versions.
      - name: Installation complète (la suite headless amorce le framework)
        run: php tools/ci-install.php
      - name: Prépare la base des tests d'intégration
        run: php tools/prepare-test-db.php --root-user=root --root-pass=root
      # Aucun test ne doit être « skipped » : un saut signifie que la base n'a pas été jointe et
      # que les tests d'intégration n'ont, une fois de plus, rien vérifié. On fait donc échouer
      # la CI dessus plutôt que de la laisser afficher un vert trompeur.
      - name: phpunit
        run: phpunit --fail-on-skipped

  db-smoke:
    name: Schema + migration runner (smoke)
    if: github.event_name == 'workflow_dispatch' || vars.CI_ENVOI != 'pause'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: neofrag
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
      NF_DB_NAME: neofrag
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - name: Import schema.sql cœur lean (valide le DDL + collations)
        run: mysql -h127.0.0.1 -P3306 -uroot -proot neofrag < install/schema.sql
      - name: Baseline des migrations déjà présentes dans le schéma (05-04)
        run: php tools/migrate.php baseline --until=2026_05_04_user_messages_extension
      - name: Applique les migrations en attente (05-06) — test réel du runner
        run: php tools/migrate.php up
      - name: Status final (tout doit être appliqué)
        run: php tools/migrate.php status
      # Le contrôle de couplage croit les annotations « couplage: ». Celui-ci ne croit rien : il
      # installe CHAQUE profil pour de vrai sur une base jetable, sert le site avec le serveur
      # intégré de PHP et échoue au moindre 5xx — y compris sur les routes des modules ABSENTS, qui
      # doivent rendre un 404 propre. C'est le seul garde-fou qui aurait attrapé la garde de `teams`
      # placée APRÈS la requête qu'elle devait protéger.
      - name: Installe Composer + extensions pour le filet de conformité
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - name: Filet de conformité (les 4 profils d'installation démarrent et répondent)
        env:
          NF_DB_NAME_PREFIX: nfprofil
        run: php tools/check-install-profiles.php

  interface:
    name: Interface (responsive mesuré + navigation admin)
    # Le job le plus long (7 à 8 minutes) : batterie entière seulement (cf. en-tête).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Le responsive ne reposait que sur des captures regardées à la main. Une entrée du suivi
    # affirmait « 0 débordement de 390 px à 2560 px » — c'était faux : 309 colonnes s'appliquaient
    # dès 0 px, et les six thèmes publics portaient encore la gouttière Bootstrap 4 (-15px) là où
    # Bootstrap 5 utilise -12px. Rien ne pouvait le dire, puisque rien ne mesurait.
    # Un débordement horizontal est un FAIT : scrollWidth > clientWidth sur la racine du document.
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: neofrag
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
      NF_DB_NAME: neofrag
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - name: composer install
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      # Une vraie installation : sans dispositions ni contenu, les pages rendraient du vide et la
      # mesure dirait « aucun débordement » sans avoir rien mesuré.
      - name: Installation complète (tous les modules + admin)
        run: php tools/ci-install.php
      # Chaque étape navigateur a SON délai : le 2026-09-23, Chrome s'est figé pendant la mesure du
      # débordement, et le job a attendu ses trente minutes avant d'échouer sans dire où. Un délai
      # par étape fait échouer vite, sous le nom de l'étape qui bloque.
      # Chrome est préinstallé sur les runners ubuntu-latest. L'outil démarre son propre serveur,
      # ouvre une session d'administrateur temporaire et fait le ménage derrière lui.
      # Sur une sous-page d'administration, il faut pouvoir remonter au module — par le fil d'Ariane
      # ou par un bouton « Retour ». Le comptage fait à la main annonçait 36 pages fautives sur 97 :
      # il ne voyait qu'un seul des deux chemins. Celui-ci ouvre les pages et regarde ce qu'elles
      # rendent, ce qui est le seul critère que vit l'utilisateur.
      - name: Retour au module depuis chaque sous-page d'administration
        timeout-minutes: 8
        run: php tools/check-admin-back.php
      # Quatre scripts sont restés en jQuery trois mois après sa sortie et plantaient au chargement
      # sans rien casser de visible : un script qui meurt avant d'attacher ses écouteurs ne fait ni
      # 500, ni ligne de journal, ni test rouge. Ce balayage ouvre chaque page dans un vrai navigateur,
      # une sonde en tête de document, et refuse toute erreur non rattrapée, violation CSP ou script
      # introuvable. C'est le contrôle qui les aurait vus en une passe.
      - name: Erreurs JavaScript et CSP au chargement des pages (navigateur réel)
        timeout-minutes: 10
        run: php tools/check-js-console.php
      # Un lien interne mort ne casse ni le code ni la page cible : il casse le CHEMIN entre les
      # deux, et rien ne le voyait. Le premier passage en a trouvé 65 sur 400 pages — dont toutes
      # les actualités, qui répondaient 404 aux membres CONNECTÉS à cause d'une erreur levée par le
      # formulaire de commentaire.
      - name: Liens internes morts (site public + administration)
        timeout-minutes: 10
        # `/demo/` est servi par une AUTRE installation en production ; le serveur intégré ne la connaît pas.
        run: php tools/check-liens.php --max=600 --ignorer=/demo
      # Un contenu rédigé dans une seule langue proposait quand même les cinq autres, et les cinq
      # rendaient 404 : soixante adresses mortes sur soixante-douze mesurées le 2026-09-21. Trois
      # propriétés doivent être vraies ensemble sur la page servie — elle répond, elle le dit, et
      # elle n'annonce aux moteurs que des adresses vivantes — et aucune ne se voit dans le code.
      # Sert seize pages qui traversent les chemins distincts du routeur, puis LIT LE JOURNAL PHP :
      # le seul contrôle qui voie une erreur survenue après l'envoi des en-têtes (302 correct, puis
      # erreur fatale à chaque redirection de langue — 24 contrôles verts pendant qu'elle tournait).
      - name: Journal PHP muet pendant que les pages répondent
        timeout-minutes: 5
        run: php tools/check-journal.php
      # Le service worker est le seul composant capable de casser un site de façon DURABLE : installé
      # dans un navigateur, il y reste même si le fichier disparaît du serveur. Deux propriétés le
      # rendent sûr — éteint il se retire, allumé il ne met jamais le HTML en cache — et aucune ne se
      # voit à la relecture. Ce pas bascule le réglage, mesure les deux états, et le remet en place.
      - name: Service worker (se retire à l extinction, ne cache jamais le HTML)
        timeout-minutes: 5
        run: php tools/check-service-worker.php
      # EN DERNIER, et c'est délibéré : ce pas SÈME du contenu, parce que le contrôle mesure des
      # pages de contenu et qu'une installation neuve n'en a aucune — il refuserait alors de juger
      # (code 2), ce qui est le bon comportement mais laisserait le job rouge. Semer plus tôt
      # changerait l'état que mesurent les pas précédents. `--sans-config-demo` laisse les thèmes.
      - name: Contenu monolingue servi dans les autres langues
        timeout-minutes: 8
        run: |
          php tools/seed-demo.php --sans-config-demo
          php tools/check-langues-contenu.php
      # Un échantillon du passage visuel complet (26 672 rendus, quarante minutes, le 2026-09-23) :
      # chaque modèle de page, dans chaque thème et ses deux modes, à 360 et 1 440 px, vu par le
      # visiteur. La sonde mesure le débordement horizontal — ce que faisait `check-responsive` ici,
      # sur onze pages d'un seul thème — et en plus les boutons en escalier, le texte tronqué ou
      # chevauchant, les images cassées, le contraste, les cibles trop petites, les erreurs
      # JavaScript. Environ 340 rendus. Après le pas précédent, parce qu'il lui faut du contenu.
      - name: Outillage du pilote (Playwright, avec le Chrome du runner)
        run: npm ci --no-audit --no-fund
      - name: Mise en page — échantillon (tous les thèmes, deux modes, 360 et 1 440 px)
        timeout-minutes: 10
        run: php tools/check-mise-en-page.php --largeurs=360,1440 --profils=visiteur --max=80 --parallele=2

  e2e-smoke:
    name: Smoke E2E (install complète + flux critiques)
    if: github.event_name == 'workflow_dispatch' || vars.CI_ENVOI != 'pause'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      # vendor/ est gitignored ET monté dans le conteneur web (docker-compose: ./:/var/www/html), et le
      # Dockerfile ne fait PAS composer install. Sans cette étape, le conteneur n'a aucun vendor/ → fatal
      # runtime dès qu'une classe vendored est instanciée (ex. PHPMailer pour l'email de lost-password → 500).
      - name: composer install (vendor/ monté dans le conteneur web)
        run: composer install --no-interaction --no-progress
      # Le tirage des images passe par l'action qui RÉESSAIE : un incident du registre Docker Hub
      # (jeton d'authentification refusé, connexion coupée) n'a rien à voir avec le dépôt et ne
      # doit pas afficher un échec. Voir .github/actions/compose-up/action.yml.
      - name: Démarrer MariaDB (stack compose)
        uses: ./.github/actions/compose-up
        with:
          args: -d --wait db
      - name: Construire + démarrer le web (apache + .htaccess réels)
        uses: ./.github/actions/compose-up
        with:
          args: -d --build web
      - name: Installer (tout bundlé + admin) — non-interactif
        run: >-
          docker compose exec -T
          -e NF_DB_HOST=db -e NF_DB_USER=neofrag -e NF_DB_PASS=neofragpass -e NF_DB_NAME=neofrag
          web php tools/ci-install.php
      - name: Recharger le web (prise en compte de la config fraîche)
        run: docker compose restart web
      - name: Attendre que le web réponde
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T web php -r '$c=curl_init("http://localhost:8080/fr");curl_setopt($c,CURLOPT_RETURNTRANSFER,1);curl_exec($c);exit(curl_getinfo($c,CURLINFO_HTTP_CODE)>=200?0:1);' && exit 0
            sleep 2
          done
          echo "web non prêt"; exit 1
      - name: Smoke test (échec au moindre 5xx)
        run: >-
          docker compose exec -T web
          php tools/check-smoke.php http://localhost:8080 --email=ci-admin@example.test
      # Le contrat des widgets face à l'éditeur en direct : demander l'écran de configuration de chacun
      # des 69 couples widget/type doit répondre 200, qu'il ait un `controllers/admin.php` ou non — dix
      # widgets sans écran étaient impossibles à ajouter. Il lui faut une installation configurée avec
      # un administrateur : c'est ici qu'elle existe. Il démarre son propre serveur PHP dans le conteneur.
      - name: Contrat des widgets face à l'éditeur en direct (chaque couple widget/type)
        run: >-
          docker compose exec -T web
          php tools/check-widget-contract.php
      # Jusqu'au 2026-10-01, ce pas sautait 67 tests en restant vert : il n'y avait pas de
      # `config/db-test.php` dans le conteneur, et les suites d'intégration se sautent elles-mêmes
      # sans base. Le pas précédent la prépare dans le service `db` de la pile, comme le job `test`
      # le fait sur la machine ; `--fail-on-skipped` refuse désormais tout saut.
      # Placé APRÈS le smoke (certains tests d'intégration réécrivent des tables jetables).
      - name: Prépare la base des tests d'intégration (dans le conteneur)
        run: >-
          docker compose exec -T web
          php tools/prepare-test-db.php --host=db --root-user=root --root-pass=rootpass
      - name: PHPUnit complet contre la base installée (integration + headless)
        run: >-
          docker compose exec -T web
          php vendor/phpunit/phpunit/phpunit --no-coverage --fail-on-skipped
      - name: Logs web (si échec)
        if: failure()
        run: docker compose logs web --tail 80
