name: Installation

# Ce que vit celui qui installe NeoFrag Reborn : il dépose le paquet, ouvre son site, et suit
# l'assistant. Ce workflow joue ce chemin-là, comme un visiteur, pour chacun des profils
# d'installation (`check-assistant`) : les écrans, la session, les refus, le compte créé, la connexion
# avec le mot de passe saisi, le journal PHP muet — sous la plus ancienne et la plus récente version
# de PHP prise en charge.
#
# Chaque semaine, dans le dépôt public, où les minutes sont gratuites ; et à la main.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  assistant:
    name: Assistant · PHP ${{ matrix.php }} · paquet ${{ matrix.variante }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        variante: ['public']
        include:
          # Le paquet de démonstration importe son contenu à la création du compte : un profil suffit.
          - { php: '8.5', variante: 'demo', profil: 'complete' }
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      # Le produit entier : dans le dépôt neofrag, les addons à la carte viennent d'extensions.
      - uses: ./.github/actions/extensions
      # Le vendor d'un paquet : sans les dépendances de développement.
      - name: composer install (production)
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - name: L'assistant, joué de bout en bout
        run: php tools/check-assistant.php --variante=${{ matrix.variante }} ${{ matrix.profil && format('--profil={0}', matrix.profil) || '' }}

  # Les trois serveurs web que le produit documente, chacun avec la configuration qu'il LIVRE
  # (`.htaccess`, `nginx.conf`, `Caddyfile`), sous la plus ancienne et la plus récente version de PHP :
  # l'assistant joué sur le vrai serveur, puis un site installé dont on éprouve les refus, la
  # réécriture et les en-têtes (`check-serveur-web`) et les flux critiques (`check-smoke`).
  serveur-web:
    name: ${{ matrix.serveur }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        serveur: ['apache', 'nginx', 'caddy']
        php: ['8.2', '8.5']
    env:
      COMPOSE_FILE: .github/serveurs-web/compose.yml
      COMPOSE_PROFILES: ${{ matrix.serveur }}
      RACINE: ${{ github.workspace }}
      PHP: ${{ matrix.php }}
      # Où s'exécutent les outils (là où est PHP), et l'adresse du site vue de là.
      SVC: ${{ matrix.serveur == 'apache' && 'apache' || 'php' }}
      URL: ${{ matrix.serveur == 'apache' && 'http://localhost' || format('http://{0}', matrix.serveur) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - uses: ./.github/actions/extensions
      - name: composer install (production)
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      # Le serveur (www-data) écrit dans l'arbre : cache, journaux, configuration, envois.
      - name: L'arbre, inscriptible par le serveur
        run: chmod -R a+rwX .
      # Hors de l'arbre servi : les configurations adaptées ne doivent pas être servies elles-mêmes.
      - name: Les configurations livrées, adaptées là où elles le disent
        run: |
          echo "CONF=$RUNNER_TEMP/conf" >> "$GITHUB_ENV"
          sh .github/serveurs-web/adapter.sh "$RACINE" "$RUNNER_TEMP/conf"
      - name: Démarrer ${{ matrix.serveur }}, PHP ${{ matrix.php }} et MariaDB
        uses: ./.github/actions/compose-up
        with:
          args: -d --build --wait
      - name: L'assistant, joué sur ce serveur (profil complet)
        run: >-
          docker compose exec -T -e NF_DB_HOST=db -e NF_DB_USER=root -e NF_DB_PASS=root "$SVC"
          php tools/check-assistant.php --url="$URL" --racine=/var/www/neofrag --profil=complete
      - name: Installation complète (tous les addons, un administrateur)
        run: >-
          docker compose exec -T -e NF_DB_HOST=db -e NF_DB_USER=root -e NF_DB_PASS=root -e NF_DB_NAME=neofrag "$SVC"
          php tools/ci-install.php
      # Le PHP qui sert le site garde en cache d'opcodes la configuration du site que l'assistant vient
      # d'installer puis d'effacer : ci-install, en ligne de commande, ne peut pas vider ce cache-là, et
      # le site lisait une config/db.php périmée (vu sous PHP-FPM). On recharge PHP, comme on le fait sur
      # un serveur après avoir remplacé une configuration à la main.
      - name: Recharger PHP (sa mémoire d'avant l'installation)
        run: |
          if [ "$SVC" = apache ]; then docker compose restart apache; else docker compose kill -s USR2 php; fi
          docker compose exec -T "$SVC" php -r 'for ($i = 0; $i < 30; $i++) { if (@file_get_contents($argv[1]) !== FALSE) exit(0); sleep(1); } exit(1);' "$URL"
      - name: Ce que le serveur refuse, ce qu'il sert, ses en-têtes
        run: docker compose exec -T "$SVC" php tools/check-serveur-web.php --url="$URL" --racine=/var/www/neofrag
      - name: Les flux critiques (échec au moindre 5xx)
        run: docker compose exec -T "$SVC" php tools/check-smoke.php "$URL" --email=ci-admin@example.test
      - name: Journaux des services (si échec)
        if: failure()
        run: docker compose logs --tail 80
      # Ce que voit le site : sa configuration, son verrou, la fin de son journal, et s'il se croit installé.
      - name: État du site (si échec)
        if: failure()
        run: >-
          docker compose exec -T "$SVC" sh -c 'ls -la config install;
          tail -n 30 logs/php.log 2>/dev/null;
          php -r "require \"neofrag/installer.php\"; var_dump(NF\\NeoFrag\\Installer::is_already_installed(\"config\"));"'

  reglages:
    name: Réglages des addons · PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: neofrag
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
      NF_DB_NAME: neofrag
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - uses: ./.github/actions/extensions
      - name: composer install (production)
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - name: Installation complète (tous les addons, un administrateur)
        run: php tools/ci-install.php
      # Un réglage numérique se relit en entier une fois enregistré : c'est la réouverture qui le juge.
      - name: Chaque écran de réglages s'ouvre, s'enregistre tel quel et se rouvre
        run: php tools/check-reglages.php --enregistrer

  # Les addons du marketplace PUBLIÉ, installés sur un site qui n'a que le cœur : par la fenêtre du
  # marketplace, puis par « Ajouter » pour ce qu'elle ne propose pas.
  extensions:
    name: Les addons du marketplace sur un site « Cœur seul »
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NF_DB_HOST: 127.0.0.1
      NF_DB_PORT: '3306'
      NF_DB_USER: root
      NF_DB_PASS: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - uses: ./.github/actions/extensions
      - name: composer install (production)
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - name: Chaque addon du catalogue s'installe
        run: php tools/check-extensions.php

  # À un PHP auquel manque une extension exigée, l'assistant et l'installeur disent laquelle.
  prerequis:
    name: Prérequis à l'envers · PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, gd, zip, curl
          coverage: none
      - uses: ./.github/actions/extensions
      - name: composer install (production)
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - name: Chaque extension exigée, retirée tour à tour
        run: php tools/check-prerequis-absents.php

  # Le PAQUET publié, déposé comme par FTP chez un hébergeur mutualisé : Apache, PHP en module, aucune
  # fonction qui lance un programme, open_basedir, 128 Mo. L'assistant y est joué de bout en bout.
  mutualise:
    name: Hébergement mutualisé simulé (le paquet publié)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_FILE: .github/serveurs-web/compose.yml
      COMPOSE_PROFILES: mutualise
      PHP: '8.2'
      OUTILS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # Le paquet que téléchargent les gens : la dernière version publiée du dépôt neofrag.
      - name: Le paquet publié, déposé comme par FTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository_owner }}/neofrag" --pattern 'neofrag-reborn-public-*.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/neofrag-reborn-public-*.zip -d "$RUNNER_TEMP/site"
          echo "RACINE=$RUNNER_TEMP/site/neofrag-reborn" >> "$GITHUB_ENV"
          chmod -R a+rwX "$RUNNER_TEMP/site"
          ls "$RUNNER_TEMP"/neofrag-reborn-public-*.zip
      - name: Démarrer l'hébergement et MariaDB
        uses: ./.github/actions/compose-up
        with:
          args: -d --build --wait
      - name: L'assistant, joué sur le paquet (profil complet, puis cœur seul)
        run: |
          for profil in complete core; do
            docker compose exec -T -e NF_DB_HOST=db -e NF_DB_USER=root -e NF_DB_PASS=root mutualise \
              php tools/check-assistant.php --url=http://localhost --racine=/var/www/neofrag --profil=$profil
          done
      - name: Journaux des services (si échec)
        if: failure()
        run: docker compose logs --tail 80

  # Les liens de tous les documents, ceux qui sortent du dépôt compris.
  liens:
    name: Les liens des documents
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Un 429 dit que le site existe et nous freine, pas que le lien est mort (gnu.org l'a fait).
      # Les documents des bibliothèques EMBARQUÉES (js/tinymce/license.md…) ne sont pas les nôtres : leurs liens ne se
      # corrigent pas ici, et gnu.org fermait la connexion à leur vieille adresse en http (1.2.33, 2026-10-06).
      - uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ github.token }}
          fail: true
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept '200..=299,429'
            --exclude '^https?://(localhost|127\.0\.0\.1|example\.(org|com|test))'
            --exclude 'neofrag-reborn\.xyz/.+/admin'
            --exclude-path 'js/tinymce'
            './**/*.md'
