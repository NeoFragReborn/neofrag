# ⚠️ Config nginx + php-fpm pour un déploiement HORS Docker (référence prod upstream).
# Le stack Docker de ce repo (docker-compose.yml) tourne sous Apache + mod_php sur le
# port 8080 avec docroot /var/www/html — il N'UTILISE PAS ce fichier. Adapter
# root / server_name / fastcgi_pass avant tout usage réel.
#
# Miroir du comportement .htaccess : fichiers sensibles refusés, css/js via l'app
# (cache-busting ?v=mtime), fichiers existants servis statiquement, le reste routé
# sur le front controller. Seuls index.php et install/index.php sont exécutables.
server {
	listen 80;

	root /var/www/services-web/;
	index index.php;

	server_name neofr.ag;

	access_log /var/log/nginx/access;
	error_log /var/log/nginx/error error;

	# Parité .htaccess : en-têtes de sécurité (la CSP, elle, est servie dynamiquement par index.php
	# avec un nonce par requête — ne pas la dupliquer ici). `always` = aussi sur les réponses d'erreur.
	# NB nginx : un `add_header` dans un location écrase ceux du serveur — n'en ajouter dans aucun
	# location ci-dessous, sinon réintroduire ces lignes.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
	# HSTS : à activer une fois le TLS en place (sans effet sur ce sample en :80).
	# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

	rewrite ^/(humans\.txt|robots\.txt|noscript\.html)$ /ajax/settings/$1;

	# Parité .htaccess : jamais servis. backups/ contient dump SQL + config/ (secrets).
	location ~ ^/(backups|cache|config|logs)/ {
		deny all;
	}
	location ~* \.(sql|lock|scssc|map|dist|ini|sh)$ {
		deny all;
	}

	location = /index.php {
		include /etc/nginx/snippets/neofrag-fastcgi.conf;
	}

	# Installeur (supprimer ce bloc une fois le site installé).
	location = /install/index.php {
		include /etc/nginx/snippets/neofrag-fastcgi.conf;
	}

	# Aucun autre script PHP n'est exécutable ni servi (config/, tools/, modules/…).
	location ~ \.php$ {
		return 404;
	}

	# Libs tierces vendorisées (TinyMCE, CodeMirror) : servies en statique, JAMAIS via l'app — certains
	# .min.js contiennent « <?= »/« <?php » que le routeur d'assets PHP exécuterait. On retire le préfixe
	# de langue éventuel (/fr/js/… -> js/…). À placer AVANT la règle css/js ci-dessous.
	location ~* ^/(?:[a-z]{2}/)?(js/(?:tinymce|codemirror)/.+)$ {
		access_log off;
		expires 30d;
		try_files /$1 =404;
	}

	# css/js passent par l'app, comme sous Apache.
	location ~* \.(css|js)$ {
		rewrite ^ /index.php?request_url=$uri last;
	}

	location ~* \.(png|jpg|jpeg|gif|swf|eot|svg|ttf|woff|woff2)$ {
		access_log off;
		log_not_found off;
		expires 360d;
		try_files $uri /index.php?request_url=$uri;
	}

	location / {
		try_files $uri /index.php?request_url=$uri&$args;
	}
}

