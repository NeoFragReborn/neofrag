# NeoFrag Reborn — exemple de configuration nginx + PHP-FPM.
#
# À adapter : le domaine, le dossier du site, l'adresse de PHP-FPM, puis le certificat (le bloc
# `listen 443` d'un certbot ou de l'hébergeur). Il fait sous nginx ce que font les `.htaccess` du
# paquet sous Apache : les dossiers et fichiers sensibles refusés, les feuilles et scripts servis
# par le site (leur adresse porte ?v=<date> pour le cache), les fichiers existants servis tels
# quels, tout le reste confié à index.php — l'assistant d'installation compris, qui s'affiche à la
# racine du site. `check-htaccess` vérifie que les trois configurations livrées (`.htaccess`,
# `Caddyfile`, ce fichier) refusent la même liste.
server {
	listen 80;

	root /var/www/neofrag;
	index index.php;

	server_name example.org;

	# Les en-têtes de sécurité (la politique de contenu, elle, est servie par index.php avec un nonce
	# par requête : ne pas la dupliquer ici). `always` les pose aussi sur les réponses d'erreur.
	# Un `add_header` dans un `location` efface ceux du serveur : n'en ajouter dans aucun ci-dessous.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
	# HSTS : à activer une fois le site servi en HTTPS.
	# add_header Strict-Transport-Security "max-age=31536000" always;

	rewrite ^/(humans\.txt|robots\.txt|noscript\.html)$ /ajax/settings/$1;

	# Jamais servis : backups/ contient la base et les secrets de config/.
	location ~ ^/(backups|cache|config|logs|install|tools|tests|docs)/ {
		deny all;
	}
	location ~* \.(sql|lock|scssc|map|dist|ini|sh|neon|md)$ {
		deny all;
	}
	location ~ ^/(package\.json|package-lock\.json|eslint\.config\.js|playwright\.config\.js|Caddyfile|nginx\.conf)$ {
		deny all;
	}

	location = /index.php {
		include /etc/nginx/snippets/neofrag-fastcgi.conf;
	}

	# Aucun autre script PHP n'est exécutable ni servi (modules/, upload/…).
	location ~ \.php$ {
		return 404;
	}

	# Les éditeurs embarqués (TinyMCE, CodeMirror) se servent tels quels, jamais par le site : certains
	# de leurs fichiers contiennent « <?php », que le routeur des feuilles et scripts exécuterait. Le
	# préfixe de langue éventuel est retiré (/fr/js/… → js/…). Avant la règle css/js ci-dessous.
	# Entre guillemets : sans eux, nginx lit l'accolade de `{2}` comme l'ouverture du bloc et refuse de
	# démarrer — c'est ce que faisait cet exemple jusqu'au 2026-10-04 (trouvé par check-serveur-web).
	location ~* "^/(?:[a-z]{2}/)?(js/(?:tinymce|codemirror)/.+)$" {
		access_log off;
		expires 30d;
		try_files /$1 =404;
	}

	# Les feuilles et scripts passent par le site, comme sous Apache.
	location ~* \.(css|js)$ {
		rewrite ^ /index.php last;
	}

	location ~* \.(png|jpg|jpeg|gif|webp|ico|eot|svg|ttf|woff|woff2|mp4)$ {
		access_log off;
		log_not_found off;
		expires 360d;
		try_files $uri /index.php$is_args$args;
	}

	location / {
		try_files $uri /index.php$is_args$args;
	}
}

# À placer dans /etc/nginx/snippets/neofrag-fastcgi.conf :
